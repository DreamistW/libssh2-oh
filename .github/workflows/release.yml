name: Publish HAR
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stable tag against package version
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$(jq -r .version library/oh-package.json5)"
  har:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci@sha256:07433d62987065c0423025abeeb9ae35eabd21f7394b109ae6c9d74e679c41b1
    env:
      DEVECO_CLI_CLT_PATH: /opt/command-line-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          command -v patch || (apt-get update && apt-get install -y --no-install-recommends patch)
          grep -Eq '^apiVersion[[:space:]]*:[[:space:]]*26' "$DEVECO_CLI_CLT_PATH/version.txt"
      - name: Compile arm64-v8a library
        run: |
          python3 scripts/build-native.py
          python3 scripts/prepare.py
      - name: Build and verify release HAR
        run: |
          ohpm install --all
          hvigorw assembleHar --mode module -p module=libssh2_oh@default -p product=default -p buildMode=release --no-daemon --stacktrace
          version=$(python3 -c "import json; print(json.load(open('library/oh-package.json5'))['version'])")
          mkdir -p dist
          asset="libssh2-oh-$version.har"
          cp library/build/default/outputs/default/libssh2_oh.har "dist/$asset"
          python3 scripts/prepare.py --verify-har "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-har
          path: dist/
          if-no-files-found: error
          overwrite: true
  release:
    if: github.ref_type == 'tag'
    needs: har
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-har
      - name: Publish Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="libssh2-oh-${GITHUB_REF_NAME#v}.har"
          sha256sum -c "$asset.sha256"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --generate-notes "$asset" "$asset.sha256"
